<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Punta San Vigilio Racer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
    }

    #gameCanvas {
      background: linear-gradient(180deg, #87CEEB 0%, #4682B4 50%, #228B22 100%);
      border: 4px solid #fff;
      border-radius: 10px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
      display: block;
      touch-action: none;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
    }

    .control-btn {
      width: 70px;
      height: 70px;
      background: rgba(255,255,255,0.3);
      border: 3px solid white;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.1s;
    }

    .control-btn:active {
      transform: scale(0.95);
      background: rgba(255,255,255,0.5);
    }

    #startScreen, #gameOverScreen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      color: white;
      border: 4px solid gold;
      box-shadow: 0 0 30px rgba(255,215,0,0.6);
    }

    #startScreen h1, #gameOverScreen h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: gold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    #startScreen p, #gameOverScreen p {
      font-size: 18px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .btn {
      padding: 15px 40px;
      font-size: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      #hud {
        font-size: 16px;
      }

      .control-btn {
        width: 60px;
        height: 60px;
        font-size: 20px;
      }

      #startScreen, #gameOverScreen {
        padding: 30px 20px;
        max-width: 90%;
      }

      #startScreen h1, #gameOverScreen h1 {
        font-size: 24px;
      }

      #startScreen p, #gameOverScreen p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="hud">
      <div>
        <div>Lap: <span id="lap">1/3</span></div>
        <div>Position: <span id="position">1st</span></div>
      </div>
      <div style="text-align: right;">
        <div>Speed: <span id="speed">0</span></div>
        <div>Items: <span id="items">0</span></div>
      </div>
    </div>

    <div id="controls">
      <button class="control-btn" id="leftBtn">←</button>
      <button class="control-btn" id="upBtn">↑</button>
      <button class="control-btn" id="downBtn">↓</button>
      <button class="control-btn" id="rightBtn">→</button>
      <button class="control-btn" id="itemBtn">🎯</button>
    </div>

    <div id="startScreen">
      <h1>🏎️ Punta San Vigilio Racer 🏎️</h1>
      <p>Race around the beautiful Lake Garda coast!</p>
      <p><strong>Controls:</strong></p>
      <p>Use arrow buttons to steer and accelerate<br>
      Collect ⭐ power-ups for speed boosts<br>
      Avoid 🌊 water hazards<br>
      Complete 3 laps to win!</p>
      <button class="btn" onclick="startGame()">START RACE</button>
    </div>

    <div id="gameOverScreen" class="hidden">
      <h1 id="resultTitle">Race Complete!</h1>
      <p id="resultText"></p>
      <p>Time: <span id="finalTime">0.00</span>s</p>
      <button class="btn" onclick="restartGame()">RACE AGAIN</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
